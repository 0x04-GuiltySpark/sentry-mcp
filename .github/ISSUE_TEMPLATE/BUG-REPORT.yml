name: Bug Report
description: File a reproducible bug report for Streaming Tech Sentry MCP
title: '[Bug]: '
labels: ['type:bug']

body:
  # --
  - type: markdown
    attributes:
      value: |
        ### Important Notice
        **GitHub issues are strictly reserved for verified software bugs and regressions.**

        If you need configuration assistance, compatibility guidance, or general troubleshooting, please join our [Discord Community](https://streamingtech.co.nz/discord).

        **General support questions or unverified environment issues opened here will be closed immediately and redirected to Discord.**

  # --
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.

    validations:
      required: true

  # --
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps required to reproduce the issue.
      placeholder: |
        1. Start container with command / Compose configuration '...'
        2. Connect your MCP client
        3. Call tool '...' with sanitised arguments '...'
        4. See error '...'

    validations:
      required: true

  # --
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: A clear and concise description of what you expected to happen.

    validations:
      required: true

  # --
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Host operating system, CPU architecture, Sentry version, MCP client, container image tag and token scopes.
      placeholder: |
        - Host OS: Fedora 44 Server / Ubuntu 24.04 / Unraid 7.x
        - CPU Architecture: AMD64 / ARM64
        - Sentry Version: self-hosted version / sentry.io
        - MCP Client and Version:
        - Token Type and Scopes (not the token):
        - Container Image: ghcr.io/streaming-tech/sentry-mcp:latest
        - Network Mode: host port / private sidecar network
        - Docker Version: 28.x

    validations:
      required: true

  # --
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste sanitised container logs (`docker logs <container>`) and failing MCP tool responses. Ensure all passwords, tokens, and personal credentials are removed.
      render: shell

    validations:
      required: false

  # --
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have verified that this issue is reproducible and not a general configuration or client setup question.
          required: true

        - label: I understand that support questions opened as GitHub issues will be closed immediately and directed to Discord.
          required: true

        - label: I have removed all sensitive credentials, passwords, and private tokens from my logs.
          required: true
