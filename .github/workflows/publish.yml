name: Build and publish

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/streaming-tech/sentry-mcp
  QEMU_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDX_VERSION: v0.38.1
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

jobs:
  # ------------------------------------------------------------------------------------
  # Check pull requests and development branches
  # ------------------------------------------------------------------------------------
  check:
    if: github.event_name == 'pull_request' || github.ref_name != 'master' || github.repository != 'Streaming-Tech/sentry-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # --
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      # --
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      # --
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      # --
      - name: Test both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=sentry-mcp-test-multiarch
          cache-to: type=gha,scope=sentry-mcp-test-multiarch,mode=max

      # --
      - name: Build both runtime images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: |
            type=gha,scope=sentry-mcp-runtime-multiarch
            type=gha,scope=sentry-mcp-test-multiarch
          cache-to: type=gha,scope=sentry-mcp-runtime-multiarch,mode=max

  # ------------------------------------------------------------------------------------
  # Publish master releases
  # ------------------------------------------------------------------------------------
  publish:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == 'master' && github.repository == 'Streaming-Tech/sentry-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    concurrency:
      group: sentry-mcp-release
      cancel-in-progress: false
    steps:
      # --
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # --
      - name: Read package version
        id: package
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # --
      - name: Check whether the version tag exists
        id: tag-exists
        uses: mukunku/tag-exists-action@5c39604fe8aef7e65acb6fbcf96ec580f7680313 #v1.7.0
        with:
          tag: ${{ steps.package.outputs.version }}

      # --
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      # --
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      # --
      - name: Test both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=sentry-mcp-test-multiarch
          cache-to: type=gha,scope=sentry-mcp-test-multiarch,mode=max

      # --
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 #v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --
      - name: Check master has not advanced
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"

      # --
      - name: Build and publish both runtime images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ steps.tag-exists.outputs.exists == 'false' && format('{0}:{1}', env.IMAGE, steps.package.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=sentry-mcp-runtime-multiarch
            type=gha,scope=sentry-mcp-test-multiarch
          cache-to: type=gha,scope=sentry-mcp-runtime-multiarch,mode=max

      # --
      - name: Create a release for a new version
        if: steps.tag-exists.outputs.exists == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd #v1.21.0
        with:
          tag: ${{ steps.package.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
